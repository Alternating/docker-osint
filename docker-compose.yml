services:
  suron:
    build: .
    image: suron-osint:latest
    container_name: suron
    restart: unless-stopped
    environment:
      RP_ID: ${RP_ID:-osint.alt-dev.com}
      RP_ORIGIN: ${RP_ORIGIN:-https://osint.alt-dev.com}
      SETUP_PASSWORD: ${SETUP_PASSWORD:?set SETUP_PASSWORD in .env}
      SURON_DATA_DIR: /data
    volumes:
      - suron-data:/data
    # No published ports on purpose: traffic enters only through the
    # Cloudflare tunnel on the internal compose network.

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: suron-cloudflared
    restart: unless-stopped
    # `?` (not `:?`) so an explicitly EMPTY token is allowed — that's the
    # signal that docker-compose.override.yml disables this service in favor
    # of an existing host cloudflared (see docker-compose.hostport.example.yml).
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - suron

volumes:
  suron-data:
