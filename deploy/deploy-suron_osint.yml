---
# Deploy Suron OSINT platform (Next.js + Cloudflare tunnel) via docker compose.
#
# Intended to be run manually from Semaphore UI; inventory is supplied by
# Semaphore, hence `hosts: all`.
#
# Overridable extra vars:
#   suron_hosts  - inventory host/group to deploy to (default: suron)
#   suron_repo   - git repository URL   (default: https://github.com/Alternating/docker-osint.git)
#   suron_branch - git ref to deploy    (default: main)
#   suron_dir    - checkout directory   (default: /opt/suron)
#
# Secrets via the Semaphore "Service-Variables" variable group. Per
# semaphore-secrets-exposure.md in the Dunwoody repo, create secret values as
# SECRET-type variables, never plain ones (plain extra variables land on the
# ansible-playbook command line).
#
# The runtime .env is MANAGED: re-rendered from these variables on every run,
# exactly like deploy-vaultwarden.yml / deploy-plane.yml render their compose
# files. Never hand-edit it on the host — changes belong in Semaphore.
#   suron_setup_password    - REQUIRED. One-time account bootstrap password;
#                             only consulted until the first passkey exists.
#   suron_cloudflared_token - bundled-tunnel connector token. Non-empty value
#                             switches COMPOSE_PROFILES=bundled-tunnel on (the
#                             vaultwarden cloudflared_enabled convention); do
#                             NOT reuse the dunwoody cloudflared_tunnel_token
#                             — each service gets its own tunnel.
#   suron_host_port         - host port NPM forwards to (default: 3001, also
#                             registered in host_vars/192.168.1.10.yml)
#
# Targeting: Suron is a single-instance app (one Cloudflare tunnel token, one
# admin account) — deploy it to exactly ONE Docker host. Either define a
# `suron` group in the inventory containing that host, or pass
# `suron_hosts=<host-or-group>` as a Semaphore extra var. If the pattern
# matches nothing, the play skips cleanly instead of touching every host.
#
# Prerequisites on the target host (NOT managed by this playbook):
#   - Docker Engine with the compose v2 plugin

- name: Deploy Suron OSINT platform
  hosts: "{{ suron_hosts | default('suron') }}"
  become: true
  any_errors_fatal: true

  vars:
    _suron_repo: "{{ suron_repo | default('https://github.com/Alternating/docker-osint.git') }}"
    _suron_branch: "{{ suron_branch | default('main') }}"
    _suron_dir: "{{ suron_dir | default('/opt/suron') }}"
    # Empty by default; the Semaphore Environment's extra var of the same
    # name overrides this (extra vars win over play vars) — the same pattern
    # deploy-vaultwarden.yml uses for its connector.
    suron_cloudflared_token: ""
    suron_bundled_tunnel_enabled: "{{ (suron_cloudflared_token | default('', true) | string | length) > 0 }}"

  tasks:
    # ------------------------------------------------------------------
    # 1. Prerequisites
    # ------------------------------------------------------------------
    - name: Ensure git is installed
      ansible.builtin.package:
        name: git
        state: present

    - name: Check that the docker CLI is available
      ansible.builtin.command: docker --version
      register: suron_docker_check
      changed_when: false
      failed_when: false

    - name: Assert that docker is installed
      ansible.builtin.assert:
        that:
          - suron_docker_check.rc == 0
        fail_msg: >-
          Docker is not installed (or not on PATH) on this host.
          This playbook does not install Docker itself - install Docker Engine
          first, then re-run the deployment.
        success_msg: "Docker found: {{ suron_docker_check.stdout | default('') }}"

    - name: Check that the docker compose v2 plugin is available
      ansible.builtin.command: docker compose version
      register: suron_compose_check
      changed_when: false
      failed_when: false

    - name: Assert that the docker compose plugin is available
      ansible.builtin.assert:
        that:
          - suron_compose_check.rc == 0
        fail_msg: >-
          The docker compose v2 plugin is not available ('docker compose version'
          failed). Install the docker-compose-plugin package for your
          distribution, then re-run the deployment.
        success_msg: "Compose found: {{ suron_compose_check.stdout | default('') }}"

    # ------------------------------------------------------------------
    # 2. Fetch the code
    # ------------------------------------------------------------------
    - name: Clone or update the Suron repository
      ansible.builtin.git:
        repo: "{{ _suron_repo }}"
        dest: "{{ _suron_dir }}"
        version: "{{ _suron_branch }}"
        force: true
      register: suron_git

    # ------------------------------------------------------------------
    # 3. Runtime config: .env is rendered from Semaphore variables on
    #    EVERY run (house pattern — no manual edits on the host, ever)
    # ------------------------------------------------------------------
    - name: Fail fast if the setup password variable is missing
      ansible.builtin.assert:
        that:
          - suron_setup_password is defined
          - suron_setup_password is string
          - suron_setup_password | length > 0
        fail_msg: >-
          suron_setup_password must be set as a SECRET-type variable in the
          Semaphore "Service-Variables" Environment (plain extra variables
          land on the ansible-playbook command line -- see
          semaphore-secrets-exposure.md).
        quiet: true
      no_log: true

    # Inline content rather than a templates/*.j2 file so this playbook stays
    # a single file to sync into the Dunwoody repo.
    - name: Render the runtime .env (managed by this playbook)
      ansible.builtin.copy:
        dest: "{{ _suron_dir }}/.env"
        owner: root
        group: root
        mode: "0600"
        content: |
          SETUP_PASSWORD={{ suron_setup_password }}
          CLOUDFLARE_TUNNEL_TOKEN={{ suron_cloudflared_token }}
          SURON_HOST_PORT={{ suron_host_port | default(3001) }}
          COMPOSE_PROFILES={{ 'bundled-tunnel' if suron_bundled_tunnel_enabled else '' }}
      no_log: true

    - name: Enable the host-port override for Nginx Proxy Manager
      ansible.builtin.copy:
        remote_src: true
        src: "{{ _suron_dir }}/docker-compose.hostport.example.yml"
        dest: "{{ _suron_dir }}/docker-compose.override.yml"
        force: false
        mode: "0644"

    # ------------------------------------------------------------------
    # 4. Build and start the stack
    # ------------------------------------------------------------------
    - name: Build images (docker compose build --pull)
      ansible.builtin.command:
        cmd: docker compose build --pull
        chdir: "{{ _suron_dir }}"
      register: suron_build
      changed_when: true

    - name: Start the stack (docker compose up -d --remove-orphans)
      ansible.builtin.command:
        cmd: docker compose up -d --remove-orphans
        chdir: "{{ _suron_dir }}"
      register: suron_up
      changed_when: >-
        'Started' in (suron_up.stderr | default(''))
        or 'Created' in (suron_up.stderr | default(''))
        or 'Recreated' in (suron_up.stderr | default(''))

    # ------------------------------------------------------------------
    # 5. Health check (app listens only on the internal compose network)
    # ------------------------------------------------------------------
    - name: Wait for Suron to answer on /api/auth/state
      ansible.builtin.command:
        cmd: docker compose exec -T suron wget -qO- http://localhost:3000/api/auth/state
        chdir: "{{ _suron_dir }}"
      register: suron_health
      retries: 12
      delay: 5
      until: suron_health.rc == 0
      changed_when: false
      failed_when: false

    - name: Assert that Suron is healthy
      ansible.builtin.assert:
        that:
          - suron_health.rc == 0
        fail_msg: >-
          Suron did not respond on http://localhost:3000/api/auth/state inside
          the container after 12 attempts (5s apart).
          rc={{ suron_health.rc | default('n/a') }}
          stdout={{ suron_health.stdout | default('') }}
          stderr={{ suron_health.stderr | default('') }}
          Check 'docker compose logs suron' in {{ _suron_dir }}.
        success_msg: "Suron is up and answering on /api/auth/state"

    # ------------------------------------------------------------------
    # 6. Recap
    # ------------------------------------------------------------------
    - name: Collect compose service status
      ansible.builtin.command:
        cmd: docker compose ps
        chdir: "{{ _suron_dir }}"
      register: suron_ps
      changed_when: false

    - name: Deployment recap
      ansible.builtin.debug:
        msg:
          - "Suron OSINT deployed successfully."
          - "Repository: {{ _suron_repo }} ({{ _suron_branch }})"
          - "Deployed ref: {{ suron_git.after | default('unknown') }}"
          - "Checkout: {{ _suron_dir }}"
          - "Auth state endpoint response: {{ suron_health.stdout | default('') }}"
          - "{{ suron_ps.stdout_lines | default([]) }}"
